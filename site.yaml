### The playbook for defining the state of the Ansible site
# This playbook should import all playbooks that are together meant to define the state
# of this Ansible site.
# The imported playbooks must be idempotent as site.yml may be run repeatedly for periodic remediation.
- name: Import cowsay
  ansible.builtin.import_playbook: playbooks/cowsay.yaml

- name: Import users
  ansible.builtin.import_playbook: playbooks/users.yaml