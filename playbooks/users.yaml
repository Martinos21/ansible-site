---
- name: Správa mého uživatele a jeho SSH klíčů
  hosts: all
  become: true

  tasks:
    - name: Kontrola, že je definován uživatel a aspoň jeden SSH klíč
      ansible.builtin.assert:
        that:
          - username is defined
          - username | length > 0
          - sshkey is defined
          - sshkey | length > 0
        fail_msg: "Chybí username nebo sshkey"
        quiet: true

    - name: Uživatel {{ username }} existuje
      ansible.builtin.user:
        name: "{{ username }}"
        state: present
        update_password: on_create

    - name: Autorizované SSH klíče pro {{ username }}
      ansible.posix.authorized_key:
        user: "{{ username }}"
        key: "{{ sshkey | join('\n') }}"
        state: present
        exclusive: true